{% extends 'blog_app/base.html' %}
{% block title %}Delete post — Blogger{% endblock %}
{% block body_block %}<section class="confirm-page"><div class="confirm-icon"><i class="bi bi-trash3"></i></div><span class="eyebrow">This cannot be undone</span><h1>Delete this story?</h1><p>“{{ object }}” will be permanently removed from your journal.</p><form method="POST" class="confirm-actions">{% csrf_token %}<button class="button danger-fill" type="submit">Yes, delete it</button><a class="button secondary" href="{% url 'blog_app:post_detail' pk=object.pk %}">Keep story</a></form></section>{% endblock %}
