{% extends 'blog_app/base.html' %}
{% block title %}Edit {{ post.title }} — Blogger{% endblock %}
{% block body_block %}<section class="editor-page"><div class="editor-heading"><div class="eyebrow"><span class="eyebrow-line"></span> Refine your story</div><h1>Edit post.</h1><p>Small changes can make a good idea land just right.</p></div><form method="POST" class="editor-card form-stack">{% csrf_token %}{{ form.as_p }}<div class="editor-footer"><a class="button secondary" href="{% url 'blog_app:post_detail' pk=post.pk %}">Cancel</a><button class="button primary" type="submit">Save changes <i class="bi bi-check2"></i></button></div></form></section>{% endblock %}
